<div class="space-y-3 w-full">
  @for (item of items(); track item.id) {
    <div class="border border-[var(--border)] bg-[var(--surface)] rounded-md overflow-hidden transition-colors">
      
      <button
        type="button"
        (click)="toggleItem(item.id)"
        class="w-full px-4 py-3 flex items-center justify-between text-left font-bold text-sm hover:bg-[var(--background)] transition-colors focus:outline-none"
      >
        <span>{{ item.title }}</span>
        
        <span class="text-[var(--text-secondary)] shrink-0 ml-2">
          @if (isOpen(item.id)) {
            <svg lucideChevronUp class="size-4"></svg>
          } @else {
            <svg lucideChevronDown class="size-4"></svg>
          }
        </span>
      </button>

      @if (isOpen(item.id)) {
        <div class="px-4 pb-4 pt-1 text-xs space-y-2 text-[var(--text-secondary)] border-t border-[var(--border)]/50">
          @for (paragraph of item.content; track $index) {
            <p class="leading-relaxed">{{ paragraph }}</p>
          }
        </div>
      }

    </div>
  }
</div>
