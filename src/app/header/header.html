<header class="sticky top-0 z-50 border-b-2 bg-[var(--surface)]  border-[var(--border)]">
  <div class="flex items-center justify-between gap-4 p-4">
    <nav class="flex gap-4">
      <a href="/">Home</a>
      <a href="/chats">Chats</a>
      <a href="/user">User</a>
    </nav>

    <input type="search" placeholder="Search here..." class="rounded-md border" />

    <button type="button" (click)="theme.toggle()">
      @if (theme.darkMode()) {
        <svg lucideMoon class="size-5 hover:text-[var(--text-secondary)]"></svg>
      } @else {
        <svg lucideSun class="size-5 hover:text-[var(--text-secondary)]"></svg>
      }
    </button>

    <a href="/login" class="border py-1 px-5 border-[var(--border)] bg-[var(--surface)]">Log In</a>
  </div>
</header>
