<div class="flex flex-col justify-center items-center h-screen">
  <div class="rounded m-4 shadow-lg p-6 border-2 border-solid border-green-500">
    <form class="flex flex-col gap-4 m-2">
      <h2 class="font-bold">Sign up</h2>
      <label>Username</label>
      <input type="text" class="rounded border-1" placeholder="John Doe" />
      <label>Email</label>
      <input type="text" class="rounded border-1" placeholder="John Doe" />
      <label>Password</label>
      <input type="password" class="rounded border-1" placeholder="John Doe" />
      <label>Confirm password</label>
      <input type="password" class="rounded border-1" placeholder="Test12!_" />
      <button type="submit" class="border-2 border-solid rounded border-blue-600 hover:bg-blue-700">
        Sign Up
      </button>
      <div class="flex flex-row mt-2 gap-2">
        <h3 class="font-light">Already have an account?</h3>
        <a href="/login" class="text-blue-600 hover:text-blue-700">Log in</a>
      </div>
    </form>
  </div>
</div>
