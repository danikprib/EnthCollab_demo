<div class="mx-auto max-w-3xl space-y-6 p-4 md:p-6">
  <div class="flex flex-col gap-2">
    <label class="text-sm text-[var(--text-secondary)]" for="project-name">Project Name</label>

    <input
      [(ngModel)]="projectName"
      class="w-full rounded-md border border-[var(--border)] bg-[var(--surface)] p-2"
      id="project-name"
      placeholder="Enter project name..."
    />
  </div>

  <div class="flex flex-col gap-2">
    <label class="text-sm text-[var(--text-secondary)]" for="description">Description</label>

    <textarea
      [(ngModel)]="description"
      rows="5"
      class="w-full min-h-[120px] resize-y rounded-md border border-[var(--border)] bg-[var(--surface)] p-2 text-sm"
      id="description"
      placeholder="Enter description..."
    ></textarea>
  </div>

  <div
    class="space-y-3 rounded-md border-2 border-[var(--safety-orange)] bg-[var(--safety-orange)]/5 p-4"
  >
    <div class="flex flex-row items-center justify-between text-[var(--text-secondary)]">
      <div class="flex items-center gap-2 text-[#FF5F00]">
        <svg lucideAlertTriangle class="size-5"></svg>
        <h3 class="text-sm font-bold uppercase tracking-wider">Hazards</h3>
      </div>
    </div>

    <textarea
      [(ngModel)]="hazard"
      rows="5"
      class="w-full min-h-[120px] resize-y rounded-md border border-[var(--border)] bg-[var(--surface)] p-2 text-sm"
      id="hazard"
      placeholder="Enter hazards..."
    ></textarea>
  </div>

  <!-- Status & Visibility 2-Column Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Project Status -->
    <div class="flex flex-col gap-2">
      <label class="text-sm text-[var(--text-secondary)]" for="project-status">Status</label>
      <select
        [(ngModel)]="projectStatus"
        id="project-status"
        class="w-full rounded-md border border-[var(--border)] bg-[var(--surface)] p-2 text-sm text-[var(--text)] outline-none cursor-pointer"
      >
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <!-- Project Visibility -->
    <div class="flex flex-col gap-2">
      <label class="text-sm text-[var(--text-secondary)]" for="project-visibility"
        >Visibility</label
      >
      <select
        [(ngModel)]="projectVisibility"
        id="project-visibility"
        class="w-full rounded-md border border-[var(--border)] bg-[var(--surface)] p-2 text-sm text-[var(--text)] outline-none cursor-pointer"
      >
        @for (option of visibilityOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Tags Section -->
  <div class="mb-4">
    <div class="flex items-center justify-between mb-1">
      <label class="block text-sm font-medium text-gray-700">Tags</label>
      @if (selectedTagIds.length > 0) {
        <button
          type="button"
          (click)="clearTags()"
          class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors"
        >
          Clear all
        </button>
      }
    </div>

    <div
      class="flex flex-wrap items-center gap-2 p-2 border rounded-md bg-white min-h-[46px] shadow-sm"
    >
      @for (tag of selectedTagIds; track tag) {
        <span
          class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800 border border-gray-300"
        >
          {{ getTagName(tag) }}
          <button
            type="button"
            (click)="removeTag(tag)"
            class="ml-1.5 text-gray-400 hover:text-red-600 focus:outline-none font-bold"
          >
            &times;
          </button>
        </span>
      }

      <select
        (change)="addTag($event)"
        class="flex-grow border-0 focus:ring-0 text-sm outline-none bg-transparent py-1 cursor-pointer text-gray-600 min-w-[120px]"
      >
        <option value="" disabled selected>+ Add tag...</option>
        @for (tag of availableTags; track tag.id) {
          <option [value]="tag.id">{{ tag.name }}</option>
        }
      </select>
    </div>
  </div>

  <button
    type="button"
    class="w-full rounded-md bg-[var(--blue)] border border-[var(--blue)] py-3 text-lg text-white hover:cursor-pointer hover:opacity-90 transition-opacity"
    (click)="onSubmit()"
  >
    Create Project
  </button>
</div>
