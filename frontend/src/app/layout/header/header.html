<header class="sticky top-0 z-50 border-b border-[var(--border)] bg-[var(--surface)]">
  <div class="mx-auto max-w-7xl px-4">
    <div class="flex min-h-16 items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-md hover:bg-[var(--background)] md:hidden"
          (click)="toggleMobileMenu()"
          aria-label="Toggle navigation menu"
        >
          @if (mobileMenuOpened()) {
            <svg lucideX class="size-5"></svg>
          } @else {
            <svg lucideMenu class="size-5"></svg>
          }
        </button>

        <a routerLink="/" class="font-bold"> EnthCollab </a>

        <nav class="hidden items-center gap-4 md:flex">
          <a routerLink="/" class="hover:text-[var(--text-secondary)] rounded-md border border-transparent px-3 py-1.5 hover:border-b-[var(--blue)] transition-colors cursor-pointer">Home</a>
          <a routerLink="/projects" class="hover:text-[var(--text-secondary)] rounded-md border border-transparent px-3 py-1.5 hover:border-b-[var(--blue)] transition-colors cursor-pointer">Projects</a>
          <a routerLink="/users" class="hover:text-[var(--text-secondary)] rounded-md border border-transparent px-3 py-1.5 hover:border-b-[var(--blue)] transition-colors cursor-pointer">Users</a>
          <a routerLink="/agent" class="hover:text-[var(--text-secondary)] rounded-md border border-transparent px-3 py-1.5 hover:border-b-[var(--blue)] transition-colors cursor-pointer">Agent</a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-md hover:bg-[var(--background)] cursor-pointer"
          (click)="theme.toggle()"
          aria-label="Toggle theme"
        >
          @if (theme.darkMode()) {
            <svg lucideMoon class="size-5"></svg>
          } @else {
            <svg lucideSun class="size-5"></svg>
          }
        </button>

        @if (auth.isLoggedIn()) {
          <a class="hover:text-[var(--text-secondary)] rounded-md border border-transparent px-3 py-1.5 hover:border-b-[var(--blue)] transition-colors cursor-pointer" routerLink="/profile">{{
            auth.currentUser()?.username
          }}</a>
          <button class="rounded-md border border-transparent px-3 py-1.5 hover:border-[var(--safety-orange)] hover:text-[var(--safety-orange)] transition-colors cursor-pointer"
           (click)="auth.logout()">
            Log out
          </button>
        } @else {
          <a routerLink="/login" class="hover:text-[var(--text-secondary)] rounded-md border border-transparent px-3 py-1.5 hover:border-b-[var(--blue)] transition-colors cursor-pointer">Log in</a>
          <a routerLink="/signup" class="hover:text-[var(--text-secondary)] rounded-md border border-transparent px-3 py-1.5 hover:border-b-[var(--blue)] transition-colors cursor-pointer">Sign up</a>
        }
      </div>
    </div>

    @if (mobileMenuOpened()) {
      <nav class="flex flex-col border-t border-[var(--border)] py-2 md:hidden">
        <a
          routerLink="/"
          class="rounded-md px-3 py-3 hover:bg-[var(--background)]"
          (click)="mobileMenuOpened.set(false)"
        >
          Home
        </a>

        <a
          routerLink="/projects"
          class="rounded-md px-3 py-3 hover:bg-[var(--background)]"
          (click)="mobileMenuOpened.set(false)"
        >
          Projects
        </a>

        <a
          routerLink="/chats"
          class="rounded-md px-3 py-3 hover:bg-[var(--background)]"
          (click)="mobileMenuOpened.set(false)"
        >
          Chats
        </a>

        <a
          routerLink="/user"
          class="rounded-md px-3 py-3 hover:bg-[var(--background)]"
          (click)="mobileMenuOpened.set(false)"
        >
          User
        </a>

        <a
          routerLink="/login"
          class="rounded-md px-3 py-3 hover:bg-[var(--background)] sm:hidden"
          (click)="mobileMenuOpened.set(false)"
        >
          Log In
        </a>
      </nav>
    }
  </div>
</header>
